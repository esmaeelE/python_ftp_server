[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python_ftp_server"
version = "1.3.18"
description = "Command line FTP server tool designed for performance and ease of use."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com"}
]
maintainers = [
    {name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com"}
]
keywords = ["ftp", "cli", "cmd", "server"]
classifiers = [
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.6"
dependencies = [
    "requests>=2.26",
    "pyftpdlib>=1.5.6",
    "pyopenssl>=21.0.0",
    'pysendfile>=2.0.1; sys_platform != "win32"',
]

[project.urls]
Homepage = "https://github.com/Red-Eyed/python_ftp_server"
Repository = "https://github.com/Red-Eyed/python_ftp_server"

[tool.hatch.build.targets.wheel]
packages = ["python_ftp_server"]
